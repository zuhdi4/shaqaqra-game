<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة الشقاقرة الصغار</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background-color: #fce4ec;
      text-align: center;
      padding: 20px;
    }
    .question { font-size: 24px; margin: 20px; }
    .options button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      background-color: #ffcc80;
      border: 2px solid #f57c00;
      cursor: pointer;
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 200px);
      grid-template-rows: repeat(4, 200px);
      gap: 2px;
      justify-content: center;
      margin: 20px auto;
    }
    .image-grid img {
      width: 200px;
      height: 200px;
      visibility: hidden;
      border: 1px solid #ce93d8;
    }
    .info-bar {
      display: flex;
      justify-content: space-around;
      margin: 10px 0;
      font-size: 18px;
    }
    #nextBtn, #restartBtn, #showHallBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #nextBtn { background-color: #4caf50; color: white; }
    #restartBtn { background-color: #2196f3; color: white; display: none; }
    #showHallBtn { background-color: #ff9800; color: white; }
    .medal { font-size: 22px; }
  </style>
</head>
<body>

<h1>لعبة الشقاقرة الصغار</h1>
<div class="info-bar">
  <div>الاسم: <span id="playerNameDisplay"></span></div>
  <div>النتيجة: <span id="score">0</span></div>
  <div>الزمن: <span id="timer">0:00</span></div>
</div>

<div id="question" class="question"></div>
<div id="options" class="options"></div>

<div class="image-grid" id="imageGrid"></div>

<div id="message"></div>
<button id="nextBtn" onclick="nextQuestion()">التالي</button>
<button id="restartBtn" onclick="restartGame()">إعادة اللعب</button>
<button id="showHallBtn" onclick="showHallOfFame()">عرض لوحة الشرف</button>

<div id="hallOfFame" style="margin-top:30px;"></div>

<script>
window.onload = function() {
  const playerName = localStorage.getItem("playerName") || "Player";
  const difficulty = localStorage.getItem("difficulty") || "easy";

  // Display the player's name in the UI
  document.getElementById("playerNameDisplay").textContent = playerName;

  // Check if required data is missing
  if (!localStorage.getItem("playerName") || !localStorage.getItem("difficulty")) {
    console.error("Player data is missing. Redirecting to index.html...");
    window.location.href = "index.html";
  }
};
</script>

</body>
</html>
